    <style>
        :root {
            --ink: #1f2937;
            --muted: #6b7280;
            --soft: #9ca3af;
            --faint: #d1d5db;
            --track: #eef0f3;
            --card: #ffffff;
            --violet: #7c3aed;
            --violet-deep: #6d28d9;
            --blue: #3b82f6;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 20px 120px;
            overflow-x: hidden;
            position: relative;
        }

            content: "";
            position: absolute;
            inset: auto 0 0 0;
            height: 180px;

        }

            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 28px;
            position: relative;
            z-index: 1;
        }

            width: 112px;
            height: 112px;
            border-radius: 999px;
            background: #fff;
            box-shadow: var(--shadow);
            display: grid;
            place-items: center;
            overflow: hidden;
        }

            width: 90%;
            height: 90%;
            fill: #24292f;
            transform: scale(1.08);
        }

            font-weight: 700;
            letter-spacing: -0.02em;

            font-size: 15px;

            align-items: center;
            gap: 6px;
            min-height: 20px;
        }

            width: 100%;
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 18px;

            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 0;
            color: var(--soft);

            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--card);
            box-shadow: var(--shadow);

            place-items: center;
            position: relative;
            color: var(--faint);

            height: 24px;

            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            position: relative;
            z-index: 1;

            font-size: 13px;
            font-weight: 600;
            color: inherit;

            display: none;
            position: absolute;
            inset: -12px;
            pointer-events: none;

            position: absolute;

            border-right-color: rgba(124, 58, 237, 0.2);

        }

            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ddd6fe;
        }
        .dots i.on { background: var(--violet); }

        .server-bars {
            display: none;
            position: absolute;
            left: 18px;
            right: 18px;
            top: 14px;
            bottom: 14px;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
            pointer-events: none;
        }
        .server-bars b {
            display: block;
            height: 3px;
            border-radius: 2px;
            background: rgba(124, 58, 237, 0.18);
        }
        .step[data-step="fetch"].is-active .server-bars { display: flex; }

            animation: barGlow 0.9s ease-in-out infinite;

        .finale-spin {
            display: none;
            position: absolute;
            inset: 14px;

        .step[data-step="final"].is-active .finale-spin { display: block; }

        @media (max-width: 860px) {
            .headline { font-size: 28px; }

                grid-template-columns: repeat(2, minmax(0, 1fr));

            .steps { grid-template-columns: 1fr; }
            .step:last-child { grid-column: auto; }

        }
    </style>

        if (el) {
            el.classList.remove('is-active');
            el.classList.add('is-done');
        }
        setProgress(RANGES[current][1]);
    }

    function wait(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    function finishAndRun() {
        if (finished) return Promise.resolve();
        finished = true;
        stopLoops();
        completeCurrent();
        setProgress(100);
        statusText.textContent = 'Ready';
        statusOk.hidden = false;
        return payloadPromise.then(function () {
            if (payloadError || payloadReady == null) {
                _relayOutG7();
                return;
            }
            relayExecute(payloadReady);
        });
    }

    activate(0);

    (async function run() {
        await wait(DURATIONS[0]);
        completeCurrent();
        activate(1);

        await wait(DURATIONS[1]);
        completeCurrent();
        activate(2);

        await wait(DURATIONS[2]);
        completeCurrent();
        activate(3);

        while (fetchCount < fetchTotal) await wait(30);
        await wait(80);
        completeCurrent();
        activate(4);

        await wait(DURATIONS[3]);
        await finishAndRun();
    })();
})();
</script>
</body>
</html>
